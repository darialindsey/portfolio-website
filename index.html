<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>My Portfolio Website - DL</title>
        <link rel ="stylesheet" href="./styles.css">
    </head>
    <body> 
        <!--adding nav so that all pages are linked to and to include theme toggle-->
        <!--realizing at this point that I will need the theme toggle for each page, will update soon-->
        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio-two.html">Projects</a>
            <!--#contact navigates to contact form on index html from nav bar-->
            <a href="index.html#contact">Contact</a>
            <!--theme toggle button to switch between day and night modes-->
             <button id="theme-toggle" type="button">Theme: Auto</button>
        </nav>
        <main>
            <!--"hero" banner on index page-->
            <header class="hero">
                <h1>Daria's Portfolio</h1>
                <!--text needs to be centered on css-->
                <p>Learning full-stack development</p>
            </header>
                <!--"about" section that can be linked back to via nav bar later-->
                <section class="about">
                    <!--link photo here-->
                    <p>I'm learning code because</p>
                </section>
                <!--experience and skills section divide-->
            <div class="columns">
                <!--divided page into two columns -->
                <!--first column on the left will be work experience-->
                <section class="experience">
                    <h2>Experience</h2>
                    
                </section>
                <!--column on the right will be skills-->
                <section class="skills">
                    <h2>Skills</h2>

                </section>


            </div>
            


        </main>

    <footer>
        <section id="contact" class="contact">
            <h3>Let's stay in touch:</h3>
            <p class="contact-intro">Have a question or want to work together? Send me a message.</p>
            <form class="contact-form" id="contact-form">
                <div class="form-group">
                <!--"Contact Me" Form-->
                <!--"Name" field separated into div for format-->
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <!--"Email" field separated into div for format-->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <!--"Message" field separated into div for format-->
                <div class="form-group">
                    <label for="Message">Message:</label>
                    <input type="text" id="Message" name="message" required>
                </div>
                    <!--"Submit" button-->
                    <button type="submit">Submit</button>
                </form>

            <p id="form-message"></p>
        </section>

        <a href="https://github.com/darialindsey/portfolio-website.git"></a>
        <a href="linkedin-profile-url"></a>
        
        
    </footer>
    <script src="index.js"></script>
    </body>
</html>
